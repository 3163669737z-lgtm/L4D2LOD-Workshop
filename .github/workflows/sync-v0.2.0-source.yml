name: Sync v0.2.0 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and unpack source
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/source.zip "https://github.com/3163669737z-lgtm/L4D2LOD-Workshop/releases/download/v0.2.0/farsight-l4d2-lod-studio-v0.2.0-source.zip"
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source

      - name: Replace source tree
        run: |
          set -euo pipefail

          # Keep the GitHub-facing README and this one-time workflow.
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              README.md|.github/workflows/sync-v0.2.0-source.yml) ;;
              *) rm -f "$f" ;;
            esac
          done

          # Copy the v0.2.0 source package, but keep the short GitHub README.
          rsync -a --exclude 'README.md' --exclude '.github' /tmp/source/ ./

          # The package no longer ships docs/; update the README pointer.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('完整使用说明在分发包的 `README.md` 里；设计与验收资料在仓库 `docs/`。', '完整使用说明在分发包的 `README.md` 里；源码包内包含完整源码和构建脚本。')
          s = s.replace('The full manual is the `README.md` inside the release package. Design and acceptance notes live under `docs/`.', 'The full manual is the `README.md` inside the release package; the source package includes the full source and build script.')
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync v0.2.0 source tree"
            git push origin HEAD:main
          fi
