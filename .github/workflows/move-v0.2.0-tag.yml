name: Move v0.2.0 tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force-move tag to clean v0.2.0 source commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v0.2.0 fffca0ae24389c42e114f40e5f3cb3502cf1ead7
          git push --force origin refs/tags/v0.2.0
